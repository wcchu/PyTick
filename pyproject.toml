[project]
name = "pytick"
version = "0.1.0"
description = "Python implementation of the GoTick tic-tac-toe reinforcement learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pytick"]
